[project]
name = "fraud"
version = "0.1.0"
description = "Real-time card fraud scoring with cost-based decisions and an LLM analyst copilot"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas>=3.1.1",
    "pyarrow>=26.0.1",
]

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "kaggle>=2.2.5",
    "pip-system-certs>=5.3",
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "ruff>=0.17.4",
    "six>=1.17.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
extend-exclude = ["notebooks"]

[tool.ruff.lint]
# E/W — стиль, F — реальные ошибки (неиспользуемые импорты, неопределённые имена),
# I — сортировка импортов, B — частые баги, UP — современный синтаксис, SIM — упрощения
select = ["E", "W", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
